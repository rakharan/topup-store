{{define "status.html"}}<!DOCTYPE html>
<html lang="id">
<head>
    <title>Cek Order - TopUp Store</title>
    <meta name="description" content="Cek status order top up game kamu.">
    {{template "head"}}
</head>
<body class="bg-dark text-white min-h-screen">
    {{template "nav" (dict "ActivePage" "status")}}

    <section class="max-w-lg mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold mb-8 text-center">Cek Status Order</h1>
        <form id="statusForm" class="flex gap-3 mb-8">
            <input type="text" id="orderId" name="id" placeholder="Masukkan ID Order" required class="flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-white/30 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary/50 focus-ring">
            <button type="submit" class="bg-primary hover:bg-orange-600 text-white font-semibold px-6 py-3 rounded-lg transition focus-ring">Cek</button>
        </form>
        <div id="result" class="hidden bg-white/5 border border-white/10 rounded-xl p-6"></div>
        <div id="autoRefresh" class="hidden mt-4 text-center text-sm text-white/40">
            <span>Auto-refresh setiap 10 detik</span>
            <button id="stopRefresh" class="text-primary ml-2 hover:underline focus-ring">Stop</button>
        </div>
    </section>

    {{template "footer"}}
    {{template "toast"}}

    <script>
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    const statusColors = {
        pending: "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
        paid: "bg-blue-500/20 text-blue-400 border-blue-500/30",
        processing: "bg-purple-500/20 text-purple-400 border-purple-500/30",
        success: "bg-green-500/20 text-green-400 border-green-500/30",
        failed: "bg-red-500/20 text-red-400 border-red-500/30",
        expired: "bg-gray-500/20 text-gray-400 border-gray-500/30",
    };
    const statusLabels = {
        pending: "Menunggu Pembayaran",
        paid: "Lunas - Sedang Diproses",
        processing: "Sedang Diproses",
        success: "Berhasil",
        failed: "Gagal",
        expired: "Kadaluarsa",
    };
    const statusSteps = ['pending', 'paid', 'processing', 'success'];

    let refreshInterval = null;

    function renderTimeline(status) {
        const currentIdx = statusSteps.indexOf(status);
        return statusSteps.map((step, i) => {
            const done = i <= currentIdx;
            const active = i === currentIdx;
            const color = done ? (step === 'success' ? 'bg-green-500' : 'bg-primary') : 'bg-white/10';
            const label = statusLabels[step];
            return `
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full ${color} flex items-center justify-center text-xs font-bold ${done ? 'text-white' : 'text-white/30'}" aria-hidden="true">
                        ${done ? '✓' : (i + 1)}
                    </div>
                    <span class="text-sm ${active ? 'text-white font-medium' : 'text-white/40'}">${label}</span>
                </div>
            `;
        }).join('');
    }

    async function fetchOrder(orderId) {
        const result = document.getElementById("result");
        const autoRefresh = document.getElementById("autoRefresh");
        if (refreshInterval) clearInterval(refreshInterval);

        try {
            const res = await fetch(`/api/orders/${orderId}`);
            if (!res.ok) {
                result.classList.remove("hidden");
                result.innerHTML = '<p class="text-red-400">Order tidak ditemukan.</p>';
                autoRefresh.classList.add("hidden");
                return;
            }
            const json = await res.json();
            const order = json.data || json;
            const badgeClass = statusColors[order.status] || "bg-white/10 text-white";
            const label = statusLabels[order.status] || order.status;

            result.classList.remove("hidden");
            const orderId = escapeHtml(order.id);
            const gameUid = escapeHtml(order.game_uid || '');
            const gameServer = escapeHtml(order.game_server || '');
            const amount = parseInt(order.amount_idr || 0).toLocaleString("id-ID");
            const createdAt = new Date(order.created_at).toLocaleString("id-ID");
            const serialNumber = order.serial_number ? escapeHtml(order.serial_number) : '';
            const qrisUrl = order.qris_url && order.qris_url.startsWith('https://') ? escapeHtml(order.qris_url) : '';

            result.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <span class="font-mono text-sm text-white/60">${orderId}</span>
                        <span class="px-3 py-1 rounded-full text-sm font-medium border ${badgeClass}">${escapeHtml(label)}</span>
                    </div>
                    <div class="space-y-3 mb-6" aria-label="Order status timeline">
                        ${renderTimeline(order.status)}
                    </div>
                    <div class="space-y-2 text-sm border-t border-white/10 pt-4">
                        <div class="flex justify-between"><span class="text-white/50">Game UID</span><span>${gameUid}${gameServer ? ' (' + gameServer + ')' : ''}</span></div>
                        <div class="flex justify-between"><span class="text-white/50">Total</span><span>Rp ${amount}</span></div>
                        <div class="flex justify-between"><span class="text-white/50">Dibuat</span><span>${escapeHtml(createdAt)}</span></div>
                        ${serialNumber ? `<div class="flex justify-between"><span class="text-white/50">Serial Number</span><span class="font-mono">${serialNumber}</span></div>` : ''}
                    </div>
                    ${order.status === 'pending' && qrisUrl ? `
                        <div class="mt-4 pt-4 border-t border-white/10 text-center">
                            <a href="${qrisUrl}" target="_blank" rel="noopener noreferrer" class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded-lg transition focus-ring">Bayar Sekarang</a>
                        </div>
                    ` : ''}
                    ${order.status === 'failed' || order.status === 'expired' ? `
                        <div class="mt-4 pt-4 border-t border-white/10 text-center">
                            <a href="/order" class="inline-block bg-primary hover:bg-orange-600 text-white font-semibold px-6 py-2 rounded-lg transition focus-ring">Order Ulang</a>
                        </div>
                    ` : ''}
                </div>
            `;

            if (['pending', 'paid', 'processing'].includes(order.status)) {
                autoRefresh.classList.remove("hidden");
                refreshInterval = setInterval(() => fetchOrder(orderId), 10000);
            } else {
                autoRefresh.classList.add("hidden");
            }
        } catch (e) {
            result.classList.remove("hidden");
            result.innerHTML = '<p class="text-red-400">Terjadi kesalahan. Coba lagi.</p>';
            autoRefresh.classList.add("hidden");
        }
    }

    document.getElementById("statusForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const orderId = document.getElementById("orderId").value.trim();
        document.getElementById("result").classList.add("hidden");
        await fetchOrder(orderId);
    });

    document.getElementById("stopRefresh").addEventListener("click", () => {
        if (refreshInterval) clearInterval(refreshInterval);
        document.getElementById("autoRefresh").classList.add("hidden");
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get("id")) {
        document.getElementById("orderId").value = params.get("id");
        document.getElementById("statusForm").dispatchEvent(new Event("submit"));
    }
    </script>
</body>
</html>{{end}}
