{{define "nav"}}
<a href="#main-content" class="skip-link" style="position:absolute;top:-40px;left:8px;background:#F97316;color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;transition:top 0.2s">Skip to content</a>
<nav class="theme-nav-bg backdrop-blur border-b theme-nav-border sticky top-0 z-50" role="navigation" aria-label="Main navigation" style="background-color: var(--bg-nav); border-color: var(--border-color);">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="text-xl font-bold text-primary flex items-center gap-2 focus-ring" aria-label="Faza TopUP Store Home">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Faza TopUp
        </a>
        <div class="hidden md:flex gap-6 items-center">
            <a href="/" class="{{if eq .ActivePage "home"}}text-primary font-medium{{else}}hover:text-primary transition{{end}} focus-ring">Home</a>
            <a href="/order" class="{{if eq .ActivePage "order"}}text-primary font-medium{{else}}hover:text-primary transition{{end}} focus-ring">Order</a>
            <a href="/status" class="{{if eq .ActivePage "status"}}text-primary font-medium{{else}}hover:text-primary transition{{end}} focus-ring">Cek Order</a>
            <a href="/terms" class="{{if eq .ActivePage "terms"}}text-primary font-medium{{else}}hover:text-primary transition{{end}} focus-ring">Syarat</a>
            <a href="/refund" class="{{if eq .ActivePage "refund"}}text-primary font-medium{{else}}hover:text-primary transition{{end}} focus-ring">Refund</a>
            <button id="themeToggle" class="p-2 hover:bg-white/10 rounded-lg focus-ring" aria-label="Toggle theme" title="Toggle theme">
                <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
        </div>
        <button id="mobileMenuBtn" class="md:hidden p-2 hover:bg-white/10 rounded-lg focus-ring" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobileMenu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden border-t px-4 py-3 space-y-3 backdrop-blur z-40 relative" role="menu" style="background-color: var(--bg-nav); border-color: var(--border-color);">
        <a href="/" class="block {{if eq .ActivePage "home"}}text-primary font-medium{{else}}hover:text-primary transition{{end}}" role="menuitem">Home</a>
        <a href="/order" class="block {{if eq .ActivePage "order"}}text-primary font-medium{{else}}hover:text-primary transition{{end}}" role="menuitem">Order</a>
        <a href="/status" class="block {{if eq .ActivePage "status"}}text-primary font-medium{{else}}hover:text-primary transition{{end}}" role="menuitem">Cek Order</a>
        <a href="/terms" class="block {{if eq .ActivePage "terms"}}text-primary font-medium{{else}}hover:text-primary transition{{end}}" role="menuitem">Syarat & Ketentuan</a>
        <a href="/refund" class="block {{if eq .ActivePage "refund"}}text-primary font-medium{{else}}hover:text-primary transition{{end}}" role="menuitem">Kebijakan Refund</a>
    </div>
</nav>
{{if .AnnouncementText}}
<div class="border-b px-4 py-2 text-center text-sm {{if eq .AnnouncementLevel "warning"}}bg-yellow-500/15 border-yellow-500/30 text-yellow-100{{else if eq .AnnouncementLevel "danger"}}bg-red-500/15 border-red-500/30 text-red-100{{else if eq .AnnouncementLevel "success"}}bg-green-500/15 border-green-500/30 text-green-100{{else}}bg-blue-500/15 border-blue-500/30 text-blue-100{{end}}">
    <div class="max-w-6xl mx-auto">{{.AnnouncementText}}</div>
</div>
{{end}}

<script>
(function() {
    const btn = document.getElementById('mobileMenuBtn');
    const menu = document.getElementById('mobileMenu');
    if (!btn || !menu) return;

    let open = false;
    const hamburger = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>';
    const close = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';

    function setOpen(state) {
        open = state;
        menu.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', String(open));
        btn.innerHTML = open ? close : hamburger;
    }

    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setOpen(!open);
    });

    menu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => setOpen(false));
    });

    document.addEventListener('click', () => {
        if (open) setOpen(false);
    });

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (themeToggle) {
        const moon = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
        const sun = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';

        function setTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            themeIcon.innerHTML = dark ? moon : sun;
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }

        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved ? saved === 'dark' : prefersDark;
        setTheme(isDark);

        themeToggle.addEventListener('click', () => {
            setTheme(!document.documentElement.classList.contains('dark'));
        });
    }
})();
</script>
{{end}}
