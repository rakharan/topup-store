services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topup}
      POSTGRES_DB: topup_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topup -d topup_store"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - topup-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - topup-network

  migrate:
    image: postgres:16-alpine
    command: >
      sh -c '
        psql "$$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS schema_migrations (version INTEGER PRIMARY KEY, filename TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
        for f in /migrations/*.sql; do
          filename=$$(basename "$$f")
          version=$$(echo "$$filename" | grep -oE "^[0-9]+" | sed "s/^0*//")
          [ -z "$$version" ] && continue
          exists=$$(psql "$$DATABASE_URL" -tAc "SELECT 1 FROM schema_migrations WHERE version=$$version")
          if [ "$$exists" = "1" ]; then
            echo "Skipping $$filename (version $$version already applied)"
          else
            echo "Applying $$filename (version $$version)..."
            psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f"
            psql "$$DATABASE_URL" -c "INSERT INTO schema_migrations (version, filename) VALUES ($$version, '\''$$filename'\'');"
            echo "Applied $$filename successfully"
          fi
        done
        echo "Migration complete"
      '
    volumes:
      - ./migrations:/migrations
    environment:
      DATABASE_URL: postgres://topup:topup@postgres:5432/topup_store?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - topup-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://topup:topup@postgres:5432/topup_store?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WA_BOT_BASE_URL: http://whatsapp-bot:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - topup-network

  whatsapp-bot:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      GO_BACKEND_URL: http://app:8080
      BOT_PORT: 3001
    depends_on:
      - app
    networks:
      - topup-network

volumes:
  pgdata:
  redisdata:

networks:
  topup-network:
    driver: bridge
