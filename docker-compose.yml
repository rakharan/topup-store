services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topup}
      POSTGRES_DB: topup_store
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topup -d topup_store"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - topup-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - topup-network

  migrate:
    image: migrate/migrate:v4.19.1
    command: ["-path", "/migrations", "-database", "postgres://topup:topup@postgres:5432/topup_store?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - topup-network

  app:
    image: sagameda/topup-store-app:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://topup:topup@postgres:5432/topup_store?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WA_BOT_BASE_URL: http://whatsapp-bot:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - topup-network

  whatsapp-bot:
    image: sagameda/topup-store-whatsapp-bot:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      GO_BACKEND_URL: http://app:8080
      BOT_PORT: 3001
    depends_on:
      app:
        condition: service_healthy
    networks:
      - topup-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - topup-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddy_data:
  caddy_config:
networks:
  topup-network:
    driver: bridge
